name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/hotelbill/app app/src/main/assets app/src/main/res/drawable
          mv index.html app/src/main/assets/index.html
          mv MainActivity.java app/src/main/java/com/hotelbill/app/MainActivity.java
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv app_build.gradle app/build.gradle
          mv ic_launcher.png app/src/main/res/drawable/ic_launcher.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HotelAaradhana-APK
          path: app/build/outputs/apk/debug/app-debug.apk
